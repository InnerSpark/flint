name: CI

# The token gates (contrast, usage, density, parity) are chained into `npm run build`.
# Until now they only ran when someone remembered to run them locally, which is how a
# 1.80:1 switch thumb and a 1.2:1 outlined chip edge reached main (ASDS-46).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # build-all.mjs regenerates dist/ for every brand (ASDS-86) and runs the contrast, color-vision,
      # parity and component guards on each.
      - name: Build and verify tokens
        run: npm run build

      # dist/ is committed so git-tag installs work without a build step. If the build
      # changes it, the committed copy was stale and consumers would get different values
      # than tokens.json claims.
      - name: dist/ is in sync with tokens.json
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "dist/ is stale. Run npm run build and commit the result."
            git --no-pager diff --stat dist
            exit 1
          fi
          echo "dist/ matches tokens.json"

  react:
    # @innerspark/flint/react (ASDS-69). react/dist is committed, like dist/, so git installs need no
    # build step (and no esbuild, React or Radix). This job builds it, checks the committed copy is
    # current, renders every component and type-checks the declarations against a sample app.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix react
      - name: Build, render and type-check
        run: npm run test:react
      - name: react/dist is in sync with react/src
        run: |
          if [ -n "$(git status --porcelain react/dist)" ]; then
            echo "react/dist is stale. Run npm run build:react and commit the result."
            exit 1
          fi

  release-metadata:
    # Only on a tag: the tag, package.json and the CHANGELOG must agree.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tag matches package.json and CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="v$(node -p "require('./package.json').version")"
          HEAD_SECTION="$(grep -m1 '^## ' CHANGELOG.md | awk '{print $2}')"
          echo "tag=$TAG package.json=$PKG changelog=$HEAD_SECTION"
          [ "$TAG" = "$PKG" ] || { echo "Tag $TAG does not match package.json $PKG"; exit 1; }
          [ "$TAG" = "$HEAD_SECTION" ] || { echo "Tag $TAG does not match the top CHANGELOG section $HEAD_SECTION"; exit 1; }
          node scripts/changelog-section.mjs "$TAG" > /dev/null || { echo "Could not extract release notes for $TAG"; exit 1; }
          echo "tag, package.json and CHANGELOG agree"

  # The Swift package (ASDS-86, ASDS-38). Linux can't compile SwiftUI, so this runs on macOS and
  # builds every brand's product for iOS and for macOS. The repo is public, so macOS minutes are free.
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build for macOS (every product)
        run: swift build
      - name: Build for iOS Simulator (every product)
        run: xcodebuild -scheme Flint-Package -destination 'generic/platform=iOS Simulator' -quiet build
