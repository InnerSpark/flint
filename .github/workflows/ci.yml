name: CI

# The token gates (contrast, usage, density, parity) are chained into `npm run build`.
# Until now they only ran when someone remembered to run them locally, which is how a
# 1.80:1 switch thumb and a 1.2:1 outlined chip edge reached main (ASDS-46).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # build.mjs regenerates dist/, then check-contrast and check-parity verify it.
      - name: Build and verify tokens
        run: npm run build

      # dist/ is committed so git-tag installs work without a build step. If the build
      # changes it, the committed copy was stale and consumers would get different values
      # than tokens.json claims.
      - name: dist/ is in sync with tokens.json
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "dist/ is stale. Run npm run build and commit the result."
            git --no-pager diff --stat dist
            exit 1
          fi
          echo "dist/ matches tokens.json"

  release-metadata:
    # Only on a tag: the tag, package.json and the CHANGELOG must agree.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tag matches package.json and CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="v$(node -p "require('./package.json').version")"
          HEAD_SECTION="$(grep -m1 '^## ' CHANGELOG.md | awk '{print $2}')"
          echo "tag=$TAG package.json=$PKG changelog=$HEAD_SECTION"
          [ "$TAG" = "$PKG" ] || { echo "Tag $TAG does not match package.json $PKG"; exit 1; }
          [ "$TAG" = "$HEAD_SECTION" ] || { echo "Tag $TAG does not match the top CHANGELOG section $HEAD_SECTION"; exit 1; }
          node scripts/changelog-section.mjs "$TAG" > /dev/null || { echo "Could not extract release notes for $TAG"; exit 1; }
          echo "tag, package.json and CHANGELOG agree"
